name: AB COMMANDES V73 barre documents

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'AB COMMANDES V73 - barre documents haut'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter V73 dans index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="document-preview-toolbar-v73.js?v=73"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit publication
        run: |
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "AB COMMANDES V73 - publier barre documents haut"
          git push
