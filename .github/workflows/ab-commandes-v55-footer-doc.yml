name: AB COMMANDES V55 footer document

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-v55:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Charger V55 dans index.html
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="modal-footer-doc-v55.js?v=55"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "AB COMMANDES V55 - activer bouton document vert"
          git push
