name: Lier les chantiers Yaya

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relier la liste des chantiers Yaya
        run: python tools/link_yaya.py
      - name: Publier la modification
        run: |
          if git diff --quiet; then
            echo "Aucune modification"
            exit 0
          fi
          git config user.name "AB COMMANDES automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Lier les commandes aux chantiers Yaya"
          git push
