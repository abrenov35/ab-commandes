name: Install V30 all files

on:
  push:
    paths:
      - '.github/workflows/install-v30-all-files.yml'
      - 'tools/install_v30_all_files.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activer upload multi-format
        run: python tools/install_v30_all_files.py
      - name: Publier
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "AB COMMANDES automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html tools/install_embed_mode.py
          git commit -m "AB COMMANDES V30 - activation tous fichiers"
          git push
