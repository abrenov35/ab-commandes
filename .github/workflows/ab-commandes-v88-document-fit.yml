name: AB COMMANDES V88 document fit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'AB COMMANDES V88 - activer lecteur valide'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter V88 en dernier
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="document-preview-fit-v88.js?v=88"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index
        run: |
          git config user.name 'abrenov35'
          git config user.email 'abrenov35@gmail.com'
          git add index.html
          git commit -m 'AB COMMANDES V88 - publier lecteur valide' || exit 0
          git push
