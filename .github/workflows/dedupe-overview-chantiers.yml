name: Dédupliquer les chantiers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dédupliquer la vue d'ensemble
        run: python tools/dedupe_overview_chantiers.py
      - name: Publier
        run: |
          if git diff --quiet; then
            echo "Aucune modification"
            exit 0
          fi
          git config user.name "AB COMMANDES automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Supprimer les doublons de chantiers"
          git push
