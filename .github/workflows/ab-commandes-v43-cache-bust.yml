name: AB COMMANDES V43 cache bust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cache-bust-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier le script upload sous une nouvelle URL
        shell: bash
        run: |
          set -euo pipefail
          cp doc-upload-reliability-v29.js doc-upload-reliability-v43.js
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'doc-upload-reliability-v29.js?v=2'
          new = 'doc-upload-reliability-v43.js?v=43'
          if old not in s and new not in s:
              raise SystemExit('Référence upload attendue introuvable dans index.html')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/ab-commandes-v43-cache-bust.yml
      - name: Commit V43
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html doc-upload-reliability-v43.js .github/workflows/ab-commandes-v43-cache-bust.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "AB COMMANDES V43 - forcer le chargement du nouvel upload"
          git push
