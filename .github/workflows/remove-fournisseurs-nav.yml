name: Retirer Fournisseurs

on:
  push:
    branches: [main]
    paths:
      - 'tools/remove_fournisseurs_nav.py'
      - '.github/workflows/remove-fournisseurs-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retirer Fournisseurs du menu
        run: python tools/remove_fournisseurs_nav.py
      - name: Publier
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "AB COMMANDES automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Retirer Fournisseurs du menu"
          git push
