name: AB COMMANDES V79 restauration aperçu document

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-v79:
    if: github.event.head_commit.message == 'AB COMMANDES V79 - restaurer aperçu document'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter V79 dans index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="document-preview-restore-v79.js?v=79"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit publication V79
        run: |
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          if git diff --quiet; then exit 0; fi
          git add index.html
          git commit -m "AB COMMANDES V79 - publier restauration aperçu"
          git push
