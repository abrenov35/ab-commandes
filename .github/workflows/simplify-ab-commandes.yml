name: Simplifier AB COMMANDES

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer la simplification
        run: python scripts/simplify_ab_commandes.py
      - name: Publier la simplification
        run: |
          if git diff --quiet; then
            echo "Aucune modification"
            exit 0
          fi
          git config user.name "AB COMMANDES automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Simplifier la modale AB COMMANDES"
          git push
