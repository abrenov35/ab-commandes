name: AB COMMANDES V84.1 restauration hauteur lecteur

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'AB COMMANDES V84.1 - activer restauration hauteur'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter V84.1 dans index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="document-preview-height-restore-v841.js?v=841"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "AB COMMANDES V84.1 - publier restauration hauteur"
          git push
