name: AB COMMANDES V70 statut choix client par defaut

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'AB COMMANDES V70 - statut choix client par defaut'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Charger V70 en dernier
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="default-status-choice-v70.js?v=70"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "AB COMMANDES V70 - publier statut choix client"
            git push
          fi
