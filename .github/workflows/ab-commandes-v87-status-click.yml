name: AB COMMANDES V87 status click

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'AB COMMANDES V87 - clic statuts fiable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump collapsed status cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='collapsed-status-groups.js?v=4'
          new='collapsed-status-groups.js?v=5'
          if old not in s:
              raise SystemExit('cache marker introuvable')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit index
        run: |
          git config user.name 'abrenov35'
          git config user.email 'abrenov35@gmail.com'
          git add index.html
          git commit -m 'AB COMMANDES V87 - publier clic statuts' || exit 0
          git push
