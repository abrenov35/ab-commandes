name: AB COMMANDES V75 lecteur document final

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish-v75:
    if: github.event.head_commit.message == 'AB COMMANDES V75 - lecteur document final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter V75 a index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="document-preview-final-v75.js?v=75"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit publication V75
        run: |
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "AB COMMANDES V75 - publier lecteur document final"
          git push
