name: AB COMMANDES V94 corbeilles lecteur Yaya

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'CMD V94 - activer corbeilles lecteur Yaya'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forcer le chargement V94 du lecteur Yaya
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="yaya-parent-preview-v93.js?v=93"></script>'
          new='<script src="yaya-parent-preview-v93.js?v=94"></script>'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('pont Yaya V93 introuvable')
          p.write_text(s,encoding='utf-8')

          Path('version.json').write_text('{\n  "app": "AB COMMANDES",\n  "version": "94",\n  "updated": "2026-09-14"\n}\n',encoding='utf-8')
          PY
      - name: Commit publication
        run: |
          git config user.name 'abrenov35'
          git config user.email 'abrenov35@gmail.com'
          git add index.html version.json
          git commit -m 'CMD V94 - publier corbeilles lecteur Yaya' || exit 0
          git push
