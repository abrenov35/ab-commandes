name: AB COMMANDES V50 modal sections clean

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'AB COMMANDES V50 - publier modale sans titres')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Charger la V50
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="modal-sections-clean-v50.js?v=50"></script>'
          s=s.replace(tag+'\n','').replace(tag,'')
          s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "AB COMMANDES V50 - activer modale sans titres"
          git push
