name: Mode intégré Yaya

on:
  push:
    paths:
      - '.github/workflows/install-embed-mode.yml'
      - 'tools/install_embed_mode.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer le mode intégré
        run: python tools/install_embed_mode.py
      - name: Publier
        run: |
          if git diff --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "AB COMMANDES automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "AB COMMANDES V28 - fiabilisation production"
          git push
