name: AB COMMANDES V45 modal cache bust

on:
  push:
    branches: [main]
    paths:
      - 'modal-product-v4.js'
      - '.github/workflows/ab-commandes-v45-modal-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force V45 modal script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('modal-product-v4.js?v=4','modal-product-v4.js?v=45')
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: git rm -f .github/workflows/ab-commandes-v45-modal-cache-bust.yml
      - name: Commit
        run: |
          git config user.name 'abrenov35'
          git config user.email 'abrenov35@gmail.com'
          git add index.html .github/workflows/ab-commandes-v45-modal-cache-bust.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'AB COMMANDES V45 - publier nouvelle modale professionnelle'
          git push
