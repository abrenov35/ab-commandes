name: AB COMMANDES V48 status colors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'AB COMMANDES V48 - publier couleurs statuts')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Charger la V48 et forcer le cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="status-section-colors-v48.js?v=48"></script>'
          s=s.replace(tag+'\n','').replace(tag,'')
          s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "AB COMMANDES V48 - charger couleurs statuts"
          git push
