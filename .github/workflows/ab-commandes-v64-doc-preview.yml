name: AB COMMANDES V64 aperçu document

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    if: github.event.head_commit.message == 'AB COMMANDES V64 - aperçu document'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Charger V64 en dernier
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="document-preview-v64.js?v=64"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "AB COMMANDES V64 - publier aperçu document"
            git push
          fi
