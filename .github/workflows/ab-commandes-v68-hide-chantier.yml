name: AB COMMANDES V68 masquer chantier

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'AB COMMANDES V68 - masquer chantier toutes modales'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Charger V68 en dernier
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="modal-hide-chantier-v68.js?v=68"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "abrenov35"
          git config user.email "abrenov35@gmail.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "AB COMMANDES V68 - publier chantier masque"
            git push
          fi
